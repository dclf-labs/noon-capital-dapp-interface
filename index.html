    <!-- Google Analytics (gtag.js): skipped on localhost / when VITE_GA_MEASUREMENT_ID is unset -->
    <script>
      ;(function () {
        var host = location.hostname
        if (host === 'localhost' || host === '127.0.0.1') return

        var measurementId = '%VITE_GA_MEASUREMENT_ID%'
        if (!measurementId || measurementId.indexOf('%VITE_') === 0) return

        var preconnect = document.createElement('link')
        preconnect.rel = 'preconnect'
        preconnect.href = 'https://www.googletagmanager.com'
        document.head.appendChild(preconnect)

        window.dataLayer = window.dataLayer || []
        function gtag() {
          dataLayer.push(arguments)
        }
        window.gtag = gtag

        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'granted',
          functionality_storage: 'denied',
          personalization_storage: 'denied',
          security_storage: 'granted',
        })

        gtag('js', new Date())
        gtag('config', measurementId, {
          allow_google_signals: false,
          allow_ad_personalization_signals: false,
          cookie_flags: 'SameSite=Strict;Secure',
        })

        var script = document.createElement('script')
        script.async = true
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId
        document.head.appendChild(script)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
